name: Deploy static review app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create public runtime configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os

          required = ("SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing GitHub Actions secrets: {', '.join(missing)}")
          config = {
              "supabaseUrl": os.environ["SUPABASE_URL"].rstrip("/"),
              "supabaseAnonKey": os.environ["SUPABASE_PUBLISHABLE_KEY"],
              "storageBucket": "curriculum-assets",
          }
          with open("config.js", "w", encoding="utf-8") as handle:
              handle.write("window.LEHRPLAN_REVIEW_CONFIG = ")
              json.dump(config, handle, ensure_ascii=False, indent=2)
              handle.write(";\n")
          PY
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
